version: 1.0
configuration:
  has_webserver: true
  scoring:
    command: npm install && npm run test:task5
    files:
      - output/task5.xml
  readonly_paths:
    - src/test/*
    - src/data/*
    - src/index.js
  ide_config:
    default_open_files:
      - src/App.js
      - src/components/Modals/FilterModal.js
      - src/components/Navbar/FilterButton.js
      - src/components/Navbar/Navbar.js
      - src/components/HomePage.js
      - src/data/properties.json
    project_menu:
      run: npm start
      install: npm install
      test: npm install && npm run test:task5
