version: 1.0
configuration:
  has_webserver: true
  scoring:
    command: npm install && npm run test:task1
    files:
      - output/task1.xml
  readonly_paths:
    - src/test/*
    - src/data/*
    - src/index.js
  ide_config:
    default_open_files:
      - src/App.js
      - src/components/PropertyDetails.js
    project_menu:
      run: npm start
      install: npm install
      test: npm install && npm run test:task1
