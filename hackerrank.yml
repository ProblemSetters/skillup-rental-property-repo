version: 1.0
configuration:
  has_webserver: true
  scoring:
    command: npm install && npm run test:task7
    files:
      - output/task7.xml
  readonly_paths:
    - src/test/*
    - src/data/*
    - src/index.js
  ide_config:
    default_open_files:
      - src/App.js
      - src/components/Modals/UserModal.js
      - src/components/Navbar/UserButton.js
      - src/components/Navbar/Navbar.js
      - src/components/HomePage.js
      - src/components/Login.js
      - src/components/UserProfile.js
      - src/data/users.json
    project_menu:
      run: npm start
      install: npm install
      test: npm install && npm run test:task7